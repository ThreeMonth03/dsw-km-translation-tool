services:
  server:
    image: datastewardshipwizard/wizard-server:4.33.4
    ports: ["127.0.0.1:${DSW_TEST_API_PORT:?}:3000"]
    volumes:
      - ${DSW_TEST_CONFIG:?}:/app/config/application.yml:ro
    depends_on:
      postgres:
        condition: service_healthy
      bucket:
        condition: service_completed_successfully
  client:
    image: datastewardshipwizard/wizard-client:4.33.2
    ports: ["127.0.0.1:${DSW_TEST_CLIENT_PORT:?}:8080"]
    environment:
      API_URL: ${DSW_TEST_API_URL:?}
  postgres:
    image: postgres:17.5
    environment:
      POSTGRES_DB: engine-wizard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d engine-wizard"]
      interval: 2s
      timeout: 3s
      retries: 30
  minio:
    image: quay.io/minio/minio:RELEASE.2025-05-24T17-08-30Z
    ports: ["127.0.0.1:${DSW_TEST_MINIO_PORT:?}:9000"]
    command: server /data
    environment:
      MINIO_ROOT_USER: test-user
      MINIO_ROOT_PASSWORD: test-password
  bucket:
    image: quay.io/minio/mc:RELEASE.2025-05-21T01-59-54Z
    depends_on: [minio]
    entrypoint: /bin/sh
    command:
      - -c
      - |
        for attempt in $$(seq 1 60); do
          if mc alias set local http://minio:9000 test-user test-password; then
            exec mc mb --ignore-existing local/engine-wizard
          fi
          sleep 1
        done
        exit 1
