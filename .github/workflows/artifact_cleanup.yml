name: Clean merged PR artifacts

on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: read
  actions: write
  pull-requests: read

jobs:
  cleanup:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/cleanup_pr_artifacts.yml
    with:
      tooling_ref: ${{ github.sha }}
      apply: true
      artifact_patterns: native-dsw-review
