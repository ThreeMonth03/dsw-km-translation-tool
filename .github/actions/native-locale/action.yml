name: Verify native DSW locale
description: Import a PO in disposable DSW containers and report coverage and resource-page rendering.
inputs:
  translation-repository:
    description: Absolute translation repository path; omit to test tooling fixtures.
    default: ""
  artifact-name:
    description: Name of the downloadable coverage and screenshot artifact.
    default: native-dsw-review
  upload-review:
    description: Upload successful browser review evidence for seven days.
    default: "false"
  audit-source-catalog:
    description: Compare the live upstream POT during operational checks, not reproducible releases.
    default: "false"
runs:
  using: composite
  steps:
    - name: Install browser test dependencies
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      run: |
        .venv/bin/python -m pip install -e '.[browser]'
        .venv/bin/python -m playwright install --with-deps chromium
    - name: Verify official locale workflow
      id: verify
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      env:
        TRANSLATION_REPOSITORY: ${{ inputs.translation-repository }}
      run: |
        args=()
        if [[ -n "$TRANSLATION_REPOSITORY" ]]; then
          args+=(--repo-root "$TRANSLATION_REPOSITORY")
        fi
        .venv/bin/python tests/native_locale/check.py "${args[@]}" --out "$RUNNER_TEMP/native-dsw-review"
    - name: Audit Weblate upstream source catalog
      id: audit
      if: ${{ inputs.audit-source-catalog == 'true' }}
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      env:
        TRANSLATION_REPOSITORY: ${{ inputs.translation-repository }}
      run: |
        .venv/bin/dsw-km-report-source-catalog \
          --repo-root "$TRANSLATION_REPOSITORY" \
          --official-pot "$RUNNER_TEMP/native-dsw-review/official.pot" \
          --out "$RUNNER_TEMP/native-dsw-review/source-catalog" \
          --summary "$GITHUB_STEP_SUMMARY"
    - name: Upload coverage and browser screenshots
      if: success() && inputs.upload-review == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/native-dsw-review/
        if-no-files-found: warn
        retention-days: 7
    - name: Upload failure diagnostics
      if: failure() && (steps.verify.outcome == 'failure' || steps.audit.outcome == 'failure')
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ runner.temp }}/native-dsw-review/result.json
          ${{ runner.temp }}/native-dsw-review/failure.png
          ${{ runner.temp }}/native-dsw-review/*.md
          ${{ runner.temp }}/native-dsw-review/source-catalog/*.md
        if-no-files-found: warn
        retention-days: 3
