name: Clean merged PR artifacts

on:
  pull_request:
    types: [closed]
    branches: ["{{TRACKING_BRANCH}}"]

permissions:
  contents: read
  actions: write
  pull-requests: read

jobs:
  cleanup:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: {{TOOLING_REPOSITORY}}/.github/workflows/cleanup_pr_artifacts.yml@{{TOOLING_REF}}
    with:
      tooling_ref: {{TOOLING_REF}}
      apply: true
      artifact_patterns: |
        github-translation-report
        native-locale-*
        native-dsw-review
