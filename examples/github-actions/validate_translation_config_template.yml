name: KM Translation Operations

on:
  pull_request:
    branches: ["{{TRACKING_BRANCH}}"]
  push:
    branches:
      - "{{TRACKING_BRANCH}}"
  workflow_dispatch:
  schedule:
    - cron: "45 3 * * *"

permissions:
  contents: read

env:
  TOOLING_REPOSITORY: {{TOOLING_REPOSITORY}}
  TOOLING_REF: {{TOOLING_REF}}

jobs:
  validate-translation-config:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout translation operations repository
        uses: actions/checkout@v5
        with:
          repository: >-
            ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name || github.repository }}
          ref: >-
            ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.head.sha || github.sha }}
          path: translation-repo
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout pull request base repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: pull-request-base
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch pull request base commit
        if: github.event_name == 'pull_request'
        working-directory: translation-repo
        run: |
          git fetch "$GITHUB_WORKSPACE/pull-request-base" HEAD
          git update-ref refs/remotes/base/pr-base FETCH_HEAD

      - name: Checkout DSW KM Translation Tool
        uses: actions/checkout@v5
        with:
          repository: ${{ env.TOOLING_REPOSITORY }}
          ref: ${{ env.TOOLING_REF }}
          path: tooling-repo
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install tooling dependencies
        working-directory: tooling-repo
        run: make install-dev BOOTSTRAP_PYTHON=python

      - name: Validate translation configuration
        run: >-
          tooling-repo/.venv/bin/dsw-km-validate-config
          --config "$GITHUB_WORKSPACE/translation-repo/translation-config.yml"
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Report pull request translation changes
        if: github.event_name == 'pull_request'
        run: >-
          tooling-repo/.venv/bin/dsw-km-report-github-translations
          --repo-root "$GITHUB_WORKSPACE/translation-repo"
          --config "translation-config.yml"
          --base-ref "base/pr-base"
          --head-ref "HEAD"
          --json-out "$RUNNER_TEMP/github_translation_report.json"
          --details-out "$RUNNER_TEMP/github_translation_report.md"
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload pull request translation report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: github-translation-report
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/github_translation_report.json
            ${{ runner.temp }}/github_translation_report.md

      - name: Check managed repository scaffold
        run: >-
          tooling-repo/.venv/bin/dsw-km-scaffold check
          --repo-root "$GITHUB_WORKSPACE/translation-repo"
          --tooling-repo "$GITHUB_WORKSPACE/tooling-repo"

      - name: Rebuild and validate native DSW locale
        run: >-
          tooling-repo/.venv/bin/dsw-km-build-translation-repo
          --repo-root "$GITHUB_WORKSPACE/translation-repo"

      - name: Upload native locale preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: native-locale-${{ github.event.pull_request.head.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            translation-repo/builds/final_translated.po
            translation-repo/reviews/final_translated.diff

      - name: Verify native DSW import and render translations
        uses: ./tooling-repo/.github/actions/native-locale
        with:
          translation-repository: ${{ github.workspace }}/translation-repo
