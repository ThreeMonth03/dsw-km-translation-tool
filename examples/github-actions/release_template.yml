name: Publish Native KM Locale

on:
  push:
    tags: ["km-*-r*"]

permissions:
  contents: write

concurrency:
  group: locale-release-${{ github.ref }}
  cancel-in-progress: false

env:
  TOOLING_REPOSITORY: {{TOOLING_REPOSITORY}}
  TOOLING_REF: "{{TOOLING_REF}}"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout translation repository
        uses: actions/checkout@v5
        with:
          path: translation-repo
          persist-credentials: false

      - name: Checkout translation tooling
        uses: actions/checkout@v5
        with:
          repository: ${{ env.TOOLING_REPOSITORY }}
          ref: ${{ env.TOOLING_REF }}
          path: tooling-repo
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install tooling
        working-directory: tooling-repo
        run: make install-dev BOOTSTRAP_PYTHON=python

      - name: Check managed scaffold
        run: >-
          tooling-repo/.venv/bin/dsw-km-scaffold check
          --repo-root translation-repo
          --tooling-repo tooling-repo

      - name: Prepare verified locale assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          tooling-repo/.venv/bin/dsw-km-prepare-locale-release
          --repo-root translation-repo
          --tooling-repo tooling-repo
          --tag "$RELEASE_TAG"
          --out "$RUNNER_TEMP/locale-release"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/locale-release/"* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag --latest \
            --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/locale-release/release-notes.md"
