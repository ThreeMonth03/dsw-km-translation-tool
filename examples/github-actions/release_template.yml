name: Publish Native KM Locale

on:
  workflow_run:
    workflows: ["Localize Translation Auto Sync", "GitHub Translation Import", "KM Version Auto Update"]
    types: [completed]
    branches: ["{{TRACKING_BRANCH}}"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: locale-release-{{TRACKING_BRANCH}}
  cancel-in-progress: false

env:
  TOOLING_REPOSITORY: {{TOOLING_REPOSITORY}}
  TOOLING_REF: "{{TOOLING_REF}}"
  TRACKING_BRANCH: {{TRACKING_BRANCH}}

jobs:
  release:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/{{TRACKING_BRANCH}}') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == '{{TRACKING_BRANCH}}' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout translation repository
        uses: actions/checkout@v5
        with:
          path: translation-repo
          ref: {{TRACKING_BRANCH}}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout translation tooling
        uses: actions/checkout@v5
        with:
          repository: ${{ env.TOOLING_REPOSITORY }}
          ref: ${{ env.TOOLING_REF }}
          path: tooling-repo
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install tooling
        working-directory: tooling-repo
        run: make install-dev BOOTSTRAP_PYTHON=python

      - name: Check managed scaffold
        run: >-
          tooling-repo/.venv/bin/dsw-km-scaffold check
          --repo-root translation-repo
          --tooling-repo tooling-repo

      - name: Plan locale revision
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          tooling-repo/.venv/bin/dsw-km-plan-locale-release
          --repo-root translation-repo
          --repository "$GITHUB_REPOSITORY"
          --github-output "$GITHUB_OUTPUT"
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Verify Weblate alignment
        if: steps.plan.outputs.publish == 'true'
        run: >-
          tooling-repo/.venv/bin/dsw-km-report-alignment
          --repo-root translation-repo
          --json-out "$RUNNER_TEMP/alignment.json"
          --details-out "$RUNNER_TEMP/alignment.md"
          --summary "$GITHUB_STEP_SUMMARY"
          --fail-on-mismatch

      - name: Prepare verified locale assets
        if: steps.plan.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: >-
          tooling-repo/.venv/bin/dsw-km-prepare-locale-release
          --repo-root translation-repo
          --tooling-repo tooling-repo
          --tag "$RELEASE_TAG"
          --out "$RUNNER_TEMP/locale-release"

      - name: Verify native DSW import and render translations
        if: steps.plan.outputs.publish == 'true'
        uses: ./tooling-repo/.github/actions/native-locale
        with:
          translation-repository: ${{ github.workspace }}/translation-repo

      - name: Publish GitHub release
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.plan.outputs.commit }}
        run: |
          current_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$TRACKING_BRANCH" --jq '.object.sha')
          if [ "$current_commit" != "$RELEASE_COMMIT" ]; then
            printf '%s\n' 'Tracking branch advanced during validation; publication skipped.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          assets="$RUNNER_TEMP/locale-release/assets"
          po_filename="$(python -c 'import json, sys; print(json.load(open(sys.argv[1]))["po"]["filename"])' "$assets/manifest.json")"
          gh release create "$RELEASE_TAG" \
            "$assets/$po_filename" "$assets/manifest.json" "$assets/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_COMMIT" --draft \
            --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/locale-release/release-notes.md"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
